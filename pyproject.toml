[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-governor"
version = "0.1.0"
description = "Real-time budget tracker with dynamic tier degradation and token burn-rate alerts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-cost-governor = "agent_cost_governor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_cost_governor*"]
